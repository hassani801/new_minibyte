  <!-- Row 2: 1 1 0 1 (large, large, small, large) with last dot Bit Blue -->
  <circle cx="7" cy="19" r="2.2" fill="#F3F4F1" />
  <circle cx="13" cy="19" r="2.2" fill="#F3F4F1" />
  <circle cx="19" cy="19" r="0.9" fill="#F3F4F1" />
  <circle cx="25" cy="19" r="2.2" fill="#4654FF" />
