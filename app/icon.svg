<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Ink background rounded square -->
  <rect width="32" height="32" rx="7" fill="#0C0E12" />
  <!-- Row 1: 0 1 1 0 (small, large, large, small) -->
  <circle cx="7" cy="13" r="0.9" fill="#F3F4F1" />
  <circle cx="13" cy="13" r="2.2" fill="#F3F4F1" />
  <circle cx="19" cy="13" r="2.2" fill="#F3F4F1" />
